[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-prediction"
version = "0.1.0"
description = "End-to-end cryptocurrency price prediction platform with ML/DL models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="Aditya"}]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "yfinance>=0.2.30",
    "requests>=2.31.0",
    "torch>=2.1.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "ta>=0.10.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
]

[project.scripts]
crypto-train = "scripts.train:main"
crypto-predict = "scripts.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
