[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-prediction"
version = "0.3.0"
description = "End-to-end cryptocurrency price prediction platform - pretrained ML/DL ensemble, web dashboard, REST API, backtesting. Works out of the box."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="Aditya"}]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "yfinance>=0.2.30",
    "requests>=2.31.0",
    "torch>=2.1.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "plotly>=5.17.0",
    "streamlit>=1.28.0",
    "websockets>=12.0",
    "lightgbm>=4.0.0",
]

[project.optional-dependencies]
# Sentiment enrichment (news/Reddit/FinBERT) - everything else works without it
sentiment = [
    "praw>=7.7.1",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
]

[project.scripts]
crypto-prediction = "crypto_prediction.cli:entry_serve"
crypto-train = "crypto_prediction.cli:entry_train"
crypto-predict = "crypto_prediction.cli:entry_predict"
crypto-backtest = "crypto_prediction.cli:entry_backtest"
crypto-check = "crypto_prediction.cli:entry_check"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
